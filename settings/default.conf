server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # ✅ 핵심
    location /api/ {
        proxy_pass https://be-audio-test.apps.hedej.lge.com/;
        proxy_set_header Host $host;
    }
}


