server {
    listen 80;
    listen [::]:80;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log info;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ✅ API proxy (BACKEND 연결)
    location /api/ {
        proxy_pass https://be-audio-test.apps.hedej.lge.com/;
        proxy_set_header Host $host;
    }

    # ✅ React SPA routing (핵심)
    location / {
        try_files $uri $uri/ /index.html;
    }
}



