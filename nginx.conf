server {
    listen 3000;
    listen [::]:3000;

    root /usr/share/nginx/html;
    index index.html;

    # ✅ API proxy (핵심 수정)
    location /api/ {
        proxy_pass https://be-audio-test.apps.hedej.lge.com/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ✅ React routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
